coffee:
  targets:
    - node

pug:
  targets:
    node:
      - preset: js
        glob:
          - src/**/*.pug

stylus:
  targets:
    node:
      - preset: css
        glob:
          - src/**/*.styl

yaml:
  targets:
    node:
      - preset: js
        glob:
          - "{src,test}/**/*.yaml"
